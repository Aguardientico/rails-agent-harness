name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR supersedes the running build; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec standardrb

  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}${{ matrix.experimental && ' (allowed to fail)' || '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        rails: ["8.1"]
        experimental: [false]
        include:
          - ruby: "4.0"
            rails: main
            experimental: true
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  demo:
    name: Demo
    runs-on: ubuntu-latest
    env:
      RAILS_VERSION: "8.1"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: demo/run

  build:
    name: Build gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: gem build rails_agent_harness.gemspec
      - run: tar -xOf rails_agent_harness-*.gem data.tar.gz | tar -tz
      - name: Only lib/**, LICENSE.txt, README.md and CHANGELOG.md are packaged
        run: "! tar -xOf rails_agent_harness-*.gem data.tar.gz | tar -tz | grep -vE '^(lib/|LICENSE.txt$|README.md$|CHANGELOG.md$)'"
      - name: The generator and its templates are packaged
        run: |
          files=$(tar -xOf rails_agent_harness-*.gem data.tar.gz | tar -tz)
          for f in LICENSE.txt README.md CHANGELOG.md \
            lib/generators/agent_harness/install/install_generator.rb \
            lib/generators/agent_harness/install/templates/bin/agent-check.tt \
            lib/generators/agent_harness/install/templates/agent_harness.yml.tt \
            lib/generators/agent_harness/install/templates/claude/skills/rails-review/SKILL.md.tt; do
            echo "$files" | grep -qx "$f" || { echo "missing from the gem: $f"; exit 1; }
          done

  smoke:
    name: Packaged gem in a fresh Rails app
    runs-on: ubuntu-latest
    env:
      RAILS_VERSION: "8.1"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: script/smoke_packaged_gem
