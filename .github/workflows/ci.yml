name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec standardrb

  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        rails: ["main", "8.1"]
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  demo:
    name: Demo
    runs-on: ubuntu-latest
    env:
      RAILS_VERSION: main
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: demo/run

  build:
    name: Build gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: gem build rails_agent_harness.gemspec
      - run: tar -xOf rails_agent_harness-*.gem data.tar.gz | tar -tz
      - name: Only lib/**, LICENSE.txt, README.md and CHANGELOG.md are packaged
        run: "! tar -xOf rails_agent_harness-*.gem data.tar.gz | tar -tz | grep -vE '^(lib/|LICENSE.txt$|README.md$|CHANGELOG.md$)'"
      - name: Every tracked lib/ file, LICENSE.txt, README.md and CHANGELOG.md is packaged
        run: "! comm -23 <(git ls-files lib LICENSE.txt README.md CHANGELOG.md | sort) <(tar -xOf rails_agent_harness-*.gem data.tar.gz | tar -tz | sort) | grep ."

  smoke:
    name: Packaged gem in a fresh Rails app
    runs-on: ubuntu-latest
    env:
      RAILS_VERSION: main
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - run: script/smoke_packaged_gem
