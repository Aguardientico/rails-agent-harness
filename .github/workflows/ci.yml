name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR supersedes the running build; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec standardrb

  # The latest Ruby comes from .ruby-version so it is pinned in one place.
  ruby-version:
    name: Read .ruby-version
    runs-on: ubuntu-latest
    outputs:
      ruby: ${{ steps.read.outputs.ruby }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "ruby=$(tr -d '[:space:]' < .ruby-version)" >> "$GITHUB_OUTPUT"

  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    needs: ruby-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(format('["3.3", "3.4", "{0}"]', needs.ruby-version.outputs.ruby)) }}
        rails: ["main", "8.1"]
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  demo:
    name: Demo
    runs-on: ubuntu-latest
    env:
      RAILS_VERSION: "8.1"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: demo/run

  build:
    name: Build gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: gem build rails_agent_harness.gemspec
      - run: tar -xOf rails_agent_harness-*.gem data.tar.gz | tar -tz
      - name: Only lib/**, LICENSE.txt, README.md and CHANGELOG.md are packaged
        run: "! tar -xOf rails_agent_harness-*.gem data.tar.gz | tar -tz | grep -vE '^(lib/|LICENSE.txt$|README.md$|CHANGELOG.md$)'"
